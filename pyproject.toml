[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beets-plex"
version = "0.1.0"
description = "Beets plugins: Plex music library sync (plex) and file rating tags (ratingtag)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "beets>=2.12",
    "plexapi>=4.15",
    "mediafile>=0.13",
    "mutagen>=1.46",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["beetsplug"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Ruff also formats Python code blocks inside Markdown; keep it away from
# the design docs, whose snippets are prose, not maintained source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
