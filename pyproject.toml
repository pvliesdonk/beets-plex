[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "beets-plex"
description = "Beets plugins to synchronize a music library with a Plex Media Server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter van Liesdonk", email = "peter@liesdonk.nl" }]
keywords = ["beets", "plex", "music", "ratings", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dynamic = ["version"]
dependencies = [
    "beets>=2.12",
    "plexapi",
    "mediafile",
    "mutagen",
]

[project.urls]
Homepage = "https://github.com/pvliesdonk/beets-plex"
Repository = "https://github.com/pvliesdonk/beets-plex"
Issues = "https://github.com/pvliesdonk/beets-plex/issues"

[project.optional-dependencies]
test = ["pytest>=8", "ruff"]

# Version is derived from the git tag; no tags yet yields a dev version.
[tool.hatch.version]
source = "vcs"

# No plugin modules exist yet, so the wheel is deliberately metadata-only.
# `bypass-selection` makes that explicit — without it hatchling would either
# error or silently ship nothing. The real package target (`packages =
# ["beetsplug"]`) lands with the first module. sdist uses hatchling's default.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
